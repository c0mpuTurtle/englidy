spring:
  application:
    name: englidy

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/englidy}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

google:
  api-key: ${GOOGLE_API_KEY:}

cors:
  allowed-origins: http://localhost:3000,http://localhost:60040
